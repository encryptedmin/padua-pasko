{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="Maligayang Pasko! A family bunutan for the season of giving.">
  <meta property="og:title" content="Bunutan 🎁 Maligayang Pasko!">
  <meta property="og:description" content="Gawa ng pamilya, para sa pamilya.">
  <title>{% block title %}Bunutan 🎁 Maligayang Pasko!{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/parol.svg' %}">
  <link rel="preload" href="{% static 'vendor/fonts/baloo2-400.ttf' %}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{% static 'vendor/animate.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'css/bunutan.css' %}">
  <script defer src="{% static 'vendor/tailwind-browser.js' %}"></script>
  <script defer src="{% static 'vendor/gsap.min.js' %}"></script>
  <script defer src="{% static 'vendor/confetti.browser.min.js' %}"></script>
</head>
<body class="min-h-screen" data-page="{% block page_name %}generic{% endblock %}">
  <div class="sky-bokeh" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <a class="skip-link" href="#main-content">Lumaktaw sa content</a>
  <header class="site-header">
    <div class="light-string" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Bunutan home"><span class="brand-gift">🎁</span><span>Bunutan</span></a>
      <div class="header-tools" aria-label="Display settings">
        <button class="icon-button" id="sound-toggle" type="button" aria-pressed="false" aria-label="Enable sound effects" title="Sound off">🔇</button>
        <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">Motion: auto</button>
      </div>
    </div>
    <svg class="parol parol-left" viewBox="0 0 100 120" aria-hidden="true">
      <path class="parol-string" d="M50 0v25"/><circle class="parol-cap" cx="50" cy="24" r="3"/>
      <polygon class="parol-shape" points="50,28 61,45 81,47 67,61 71,81 50,71 29,81 33,61 19,47 39,45"/>
      <polygon class="parol-core" points="50,39 56,49 68,50 59,58 61,69 50,63 39,69 41,58 32,50 44,49"/>
      <path class="parol-tail" d="M38 76l-5 25m17-29v38m17-34l5 25"/>
    </svg>
    <svg class="parol parol-right" viewBox="0 0 100 120" aria-hidden="true">
      <path class="parol-string" d="M50 0v25"/><circle class="parol-cap" cx="50" cy="24" r="3"/>
      <polygon class="parol-shape" points="50,28 61,45 81,47 67,61 71,81 50,71 29,81 33,61 19,47 39,45"/>
      <polygon class="parol-core" points="50,39 56,49 68,50 59,58 61,69 50,63 39,69 41,58 32,50 44,49"/>
      <path class="parol-tail" d="M38 76l-5 25m17-29v38m17-34l5 25"/>
    </svg>
  </header>

  <main id="main-content" class="site-main mx-auto {% block main_class %}{% endblock %}" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Gawa ng pamilya, para sa pamilya 💝</p>
    <nav aria-label="Family pages"><a href="/wishlists/">Wish lists</a><a href="/reveals/">Mga nag-reveal</a></nav>
  </footer>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="{% static 'js/site.js' %}"></script>
  <script type="module" src="{% static 'js/app.js' %}"></script>
</body>
</html>
